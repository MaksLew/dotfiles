monitor=,preferred,auto,1

workspace = 4, monitor:eDP-1, default:true
workspace = 1, monitor:HDMI-A-1, default:true
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1

$terminal = ghostty
$fileManager = dolphin
$menu = fuzzel
$browser = zen-browser

exec-once = waybar --config $HOME/.config/waybar/config.json
exec-once = hyprpaper

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

general {
    gaps_in = 0
    gaps_out = 0

    border_size = 2

    col.active_border = rgba(313244ff)
    col.inactive_border = rgba(1e1e2eff)

    resize_on_border = false

    allow_tearing = false

    layout = dwidle
}

decoration {
    rounding_power = 0

    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 3
        passes = 2

        vibrancy = 0.1696
    }
}

animations {
    enabled = false

    bezier = easeOut, 0.16, 1.0, 0.3, 1.0
    bezier = easeIn, 0.7, 0.0, 0.84, 0.0

    animation = global, 1, 3.2, easeOut
    animation = windows, 1, 3.2, easeOut
    animation = windowsOut, 1, 2.6, easeIn
    animation = workspaces, 1, 3.0, easeOut
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    middle_click_paste = false
}

input {
    kb_layout = pl
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        tap-and-drag = true
        drag_lock = 1
        drag_3fg = 1
    }
}

device {
    name = logitech-usb-optical-mouse
    sensitivity = -0.35
}

gesture = 3, horizontal, workspace

$mainMod = SUPER

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, X, killactive,
bind = $mainMod, Q, exec, wlogout --layout $HOME/.config/hypr/wlogout-layout --css $HOME/.config/hypr/wlogout-style.css --buttons-per-row 2 --no-span
bind = $mainMod, B, exec, $browser
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, SPACE, fullscreen, 1
bind = $mainMod SHIFT, Space, fullscreen, 2
bind = , PRINT, exec, mkdir -p "$HOME/Pictures/Screenshots"; grim "$HOME/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png"; notify-send "Screenshot saved"
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy; notify-send "Screenshot copied"
bind = $mainMod SHIFT, R, exec, if pgrep -x wf-recorder >/dev/null 2>&1; then pkill -INT wf-recorder; notify-send "Recording stopped"; elif command -v wf-recorder >/dev/null 2>&1; then mkdir -p "$HOME/Videos/Recordings"; wf-recorder -f "$HOME/Videos/Recordings/$(date +%Y-%m-%d_%H-%M-%S).mp4" >/tmp/wf-recorder.log 2>&1 & notify-send "Recording started"; else notify-send "wf-recorder is not installed"; fi
bind = $mainMod CTRL, R, exec, if pgrep -x wf-recorder >/dev/null 2>&1; then pkill -INT wf-recorder; notify-send "Recording stopped"; elif command -v wf-recorder >/dev/null 2>&1; then mkdir -p "$HOME/Videos/Recordings"; region="$(slurp)" && { wf-recorder -g "$region" -f "$HOME/Videos/Recordings/$(date +%Y-%m-%d_%H-%M-%S).mp4" >/tmp/wf-recorder.log 2>&1 & notify-send "Recording started"; }; else notify-send "wf-recorder is not installed"; fi

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
